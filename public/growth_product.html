<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growth Product – Design Rater</title>
  <style>
    :root { --bg:#f5f7fb; --text:#1a202c; --muted:#64748b; --card:#ffffff; --border:#e9ecef; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin:0; background: var(--bg); color: var(--text); }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; display:grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items:start; }
    .chat-container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display:flex; flex-direction:column; }
    .chat-header { background: #ffffff; border-bottom:1px solid var(--border); padding: 14px 16px; display:flex; align-items:center; justify-content:space-between; }
    .chat-header h2 { margin:0; font-size: 1.1rem; font-weight: 600; display:flex; align-items:center; gap:8px; }
    .header-actions { display:flex; gap:10px; align-items:center; }
    .btn { border:1px solid var(--border); background:#f8fafc; color:#111827; padding:8px 12px; border-radius:8px; font-weight:600; cursor:pointer; }
    .btn.primary { background: var(--accent); color:#fff; border: none; }
    .btn.link { background:#eef2ff; color:#1e3a8a; border-color:#c7d2fe; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
    .content { padding: 16px; display:grid; gap:12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    label { display:block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, textarea, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #ffffff; color: var(--text); }
    textarea { min-height: 90px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .preview { display:flex; align-items:center; gap:12px; }
    .preview img { max-height: 220px; border-radius: 8px; border: 1px solid var(--border); }
    .sidebar { display:flex; flex-direction:column; gap:16px; }
    .leaderboard table { width:100%; border-collapse: collapse; }
    .leaderboard th, .leaderboard td { border-bottom:1px solid var(--border); padding:10px; text-align:left; }
    .muted { color: var(--muted); }
    .hint { font-size:12px; color: var(--muted); }
    .result { background:#f8fafc; border:1px solid var(--border); border-radius:12px; padding:12px; }
    .result h3 { margin:0 0 6px 0; font-size:1rem; }
  </style>
  <script>
    const DEFAULT_FN = 'https://iiolvvdnzrfcffudwocp.supabase.co/functions/v1/llm-proxy-growth'
    function getFnUrl(){ return DEFAULT_FN }
    let imageDataUrl = ''

    function $(id){ return document.getElementById(id) }

    async function loadSettings(){
      try {
        const res = await fetch(`${getFnUrl()}/settings`)
        const data = await res.json()
        $('model').value = data?.model || 'gpt-4o'
        $('prompt').value = data?.system_prompt || ''
      } catch (_) {}
    }

    async function saveSettings(){
      const model = $('model').value.trim()
      const system_prompt = $('prompt').value
      $('saveStatus').textContent = 'Saving...'
      try {
        const res = await fetch(`${getFnUrl()}/settings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model, system_prompt })
        })
        const data = await res.json()
        if (!res.ok || !data.success) throw new Error(data.error || 'Save failed')
        $('saveStatus').textContent = 'Saved'
        await loadSettings()
        setTimeout(()=> $('saveStatus').textContent = '', 1500)
      } catch (e) {
        $('saveStatus').textContent = 'Error saving'
      }
    }

    function handleFile(file){
      if (!file) return
      const reader = new FileReader()
      reader.onload = e => {
        imageDataUrl = e.target.result
        $('imgPreview').src = imageDataUrl
        $('imgPreview').style.display = 'block'
      }
      reader.readAsDataURL(file)
    }

    function pasteHandler(e){
      const items = e.clipboardData && e.clipboardData.items
      if (!items) return
      for (const item of items){
        if (item.type.indexOf('image') !== -1){
          const file = item.getAsFile()
          handleFile(file)
          e.preventDefault()
          return
        }
      }
    }

    async function rate(){
      const username = $('username').value.trim()
      const email = $('email').value.trim()
      const context = $('context').value.trim()
      if (!username || !email){ alert('Username and email are required'); return }
      if (!imageDataUrl){ alert('Upload or paste an image'); return }
      $('rateBtn').disabled = true
      $('result').innerHTML = '<div class="muted">Rating...</div>'
      try {
        const res = await fetch(getFnUrl(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, context, image: imageDataUrl })
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Error')
        $('result').innerHTML = `
          <div class="result">
            <h3>Grade: ${data.grade}/100</h3>
            <div class="muted">Model: ${data.model} • ${data.latency_ms}ms</div>
            <p>${data.justification}</p>
            <ul>
              <li>${(data.improvements||[])[0]||''}</li>
              <li>${(data.improvements||[])[1]||''}</li>
            </ul>
          </div>
        `
        await loadLeaderboard()
      } catch (e) {
        $('result').innerHTML = `<div class="result" style="border-color:#fecaca;background:#fff1f2;">Error: ${e.message}</div>`
      } finally {
        $('rateBtn').disabled = false
      }
    }

    async function loadLeaderboard(){
      try {
        const res = await fetch(`${getFnUrl()}/leaderboard?limit=50`)
        const data = await res.json()
        const rows = (data||[]).map((r,i)=>`<tr><td>${i+1}</td><td>${r.username}</td><td>${r.best_grade}</td><td class="muted">${new Date(r.best_at).toLocaleString()}</td></tr>`).join('')
        $('leaderboardBody').innerHTML = rows
      } catch (_) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSettings()
      loadLeaderboard()
      $('file').addEventListener('change', e => handleFile(e.target.files[0]))
      document.addEventListener('paste', pasteHandler)
    })
  </script>
  </head>
  <body>
    <div class="container">
      <div class="chat-container">
        <div class="chat-header">
          <h2><i class="fas fa-bolt"></i> Growth Product</h2>
          <div class="header-actions">
            <a class="btn link" href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
            <button id="rateBtn" class="btn primary" onclick="rate()">Rate my design</button>
          </div>
        </div>
        <div class="content">
          <div class="card">
            <div class="row">
              <div>
                <label>Username</label>
                <input id="username" placeholder="your handle" />
              </div>
              <div>
                <label>Email</label>
                <input id="email" placeholder="you@example.com" />
              </div>
            </div>
            <div class="row" style="margin-top:12px;">
              <div>
                <label>Upload image (or paste from clipboard)</label>
                <input id="file" type="file" accept="image/*" />
                <div class="hint">Tip: Take a screenshot, then Cmd+V here.</div>
              </div>
              <div class="preview">
                <img id="imgPreview" style="display:none;" />
              </div>
            </div>
            <div style="margin-top:12px;">
              <label>Context (optional)</label>
              <textarea id="context" placeholder="Platform, screen purpose, target users, etc."></textarea>
            </div>
          </div>
          <div class="card">
            <label>Result</label>
            <div id="result"></div>
          </div>
        </div>
      </div>

      <div class="sidebar">
        
        <div class="card">
          <div class="row">
            <div>
              <label>Model</label>
              <input id="model" placeholder="gpt-4o" />
            </div>
          </div>
          <div style="margin-top:12px;">
            <label>System Prompt</label>
            <textarea id="prompt" placeholder="System prompt used by the growth agent"></textarea>
          </div>
          <div style="margin-top:12px; display:flex; gap:10px;">
            <button class="btn" onclick="saveSettings()">Save Settings</button>
            <span id="saveStatus" class="muted"></span>
          </div>
        </div>
        <div class="card leaderboard">
          <h3 style="margin:0 0 8px;">Leaderboard</h3>
          <table>
            <thead><tr><th>#</th><th>Username</th><th>Best Grade</th><th>When</th></tr></thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </body>
</html>
