<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growth Product – Design Rater</title>
  <style>
    :root { --bg:#f5f7fb; --text:#1a202c; --muted:#64748b; --card:#ffffff; --border:#e9ecef; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin:0; background: var(--bg); color: var(--text); }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; display:grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items:start; }
    .chat-container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display:flex; flex-direction:column; }
    .chat-header { background: #ffffff; border-bottom:1px solid var(--border); padding: 14px 16px; display:flex; align-items:center; justify-content:space-between; }
    .chat-header h2 { margin:0; font-size: 1.1rem; font-weight: 600; display:flex; align-items:center; gap:8px; }
    .header-actions { display:flex; gap:10px; align-items:center; }
    .btn { border:1px solid var(--border); background:#f8fafc; color:#111827; padding:8px 12px; border-radius:8px; font-weight:600; cursor:pointer; }
    .btn.primary { background: var(--accent); color:#fff; border: none; }
    .btn.link { background:#eef2ff; color:#1e3a8a; border-color:#c7d2fe; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
    .content { padding: 16px; display:grid; gap:12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    label { display:block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, textarea, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #ffffff; color: var(--text); }
    textarea { min-height: 90px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .preview { display:flex; align-items:center; gap:12px; }
    .preview img { max-height: 220px; border-radius: 8px; border: 1px solid var(--border); }
    .sidebar { display:flex; flex-direction:column; gap:16px; }
    .leaderboard table { width:100%; border-collapse: collapse; }
    .leaderboard th, .leaderboard td { border-bottom:1px solid var(--border); padding:10px; text-align:left; }
    .muted { color: var(--muted); }
    .hint { font-size:12px; color: var(--muted); }
    .result { background:#f8fafc; border:1px solid var(--border); border-radius:12px; padding:12px; }
    .result h3 { margin:0 0 6px 0; font-size:1rem; }
  </style>
  <script>
    const DEFAULT_FN = 'https://iiolvvdnzrfcffudwocp.supabase.co/functions/v1/llm-proxy-growth'
    function getFnUrl(){ return DEFAULT_FN }
    // Some Supabase setups require anon apikey headers even for Functions. Reuse the same anon seen in main page.
    const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlpb2x2dmRuenJmY2ZmdWR3b2NwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc1MjE4MDAsImV4cCI6MjA3MzA5NzgwMH0.2-e8Scn26fqsR11h-g4avH8MWybwLTtcf3fCN9qAgVw'
    function fnHeaders(){ return { 'Content-Type': 'application/json', 'apikey': ANON, 'Authorization': `Bearer ${ANON}` } }
    let imageDataUrl = ''

    function $(id){ return document.getElementById(id) }

    async function loadSettings(){
      try {
        const res = await fetch(`${getFnUrl()}/settings`, { headers: fnHeaders() })
        const data = await res.json()
        $('model').value = data?.model || 'gpt-4o'
        $('prompt').value = data?.system_prompt || ''
      } catch (_) {}
    }

    async function saveSettings(){
      const model = $('model').value.trim()
      const system_prompt = $('prompt').value
      $('saveStatus').textContent = 'Saving...'
      try {
        const payload = { model, system_prompt }
        const res = await fetch(`${getFnUrl()}/settings`, {
          method: 'POST',
          headers: fnHeaders(),
          body: JSON.stringify(payload)
        })
        const data = await res.json()
        if (!res.ok || !data.success) throw new Error(data.error || 'Save failed')
        $('saveStatus').textContent = 'Saved'
        await loadSettings()
        setTimeout(()=> $('saveStatus').textContent = '', 1500)
      } catch (e) {
        $('saveStatus').textContent = 'Error saving'
      }
    }

    function handleFile(file){
      if (!file) return
      const reader = new FileReader()
      reader.onload = e => {
        imageDataUrl = e.target.result
        $('imgPreview').src = imageDataUrl
        $('imgPreview').style.display = 'block'
      }
      reader.readAsDataURL(file)
    }

    function pasteHandler(e){
      const items = e.clipboardData && e.clipboardData.items
      if (!items) return
      for (const item of items){
        if (item.type.indexOf('image') !== -1){
          const file = item.getAsFile()
          handleFile(file)
          e.preventDefault()
          return
        }
      }
    }

    async function rate(){
      const username = $('username').value.trim()
      const email = $('email').value.trim()
      const context = $('context').value.trim()
      const modelInput = $('model').value.trim()
      const promptInput = $('prompt').value
      if (!username || !email){ alert('Username and email are required'); return }
      if (!imageDataUrl){ alert('Upload or paste an image'); return }
      $('rateBtn').disabled = true
      $('result').innerHTML = '<div class="muted">Rating...</div>'
      try {
        // Enforce JSON contract regardless of saved settings
        const JSON_ENFORCER = '\n\n**JSON response contract (do not violate)**\n- Output JSON only with keys: grade, justification, improvements.\n- grade: integer 0–100.\n- justification: a single string containing the full multiline block, with newlines preserved.\n- improvements: array of exactly 2 short, specific strings.\n- No extra keys, no markdown fences, no preamble.'
        const prompt_override = (promptInput || '') + JSON_ENFORCER
        const model_override = modelInput || undefined
        const res = await fetch(getFnUrl(), {
          method: 'POST',
          headers: fnHeaders(),
          body: JSON.stringify({ username, email, context, image: imageDataUrl, prompt_override, model_override })
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.details || data.error || 'Error')
        function formatJustification(txt, improvements){
          try {
            if (!txt) return ''
            let out = String(txt)
              .replace(/\r\n/g,'\n')
              .replace(/\r/g,'\n')
            // Keep arrow line with flows on same line (tolerant to spacing/case/extra text)
            out = out.replace(/\n+\s*👉\s*\n+\s*((?:flows?)\s*to\s*look\s*at\s*for\s*inspiration[^\n]*)/i, '\n👉 $1')
            // Put TOTAL DESIGN POINTS on its own line and add a blank line after
            out = out.replace(/\s*(TOTAL DESIGN POINTS:\s*\d+\s*\(out of 1000\))/i, '<br>$1<br>')
            // Isolate quoted punchline on its own line
            out = out.replace(/("|“)([^"”]+)("|”)/g, '<br>$1$2$3<br>')
            // Ensure section headers are on their own line and emoji content on next line
            var sections = ['Usability','Information architecture','Look & feel','Consistency','Business & conversion']
            sections.forEach(function(name){
              var esc = name.replace(/([.*+?^${}()|\[\]\\])/g,'\\$1')
              // ensure header has its own line even without emoji following
              var re1 = new RegExp('(?:^|\n)\s*'+esc+'\b','gi')
              out = out.replace(re1, function(m){ return '<br><br>'+name })
              // and if emoji follows immediately after header text, put emoji on next line
              var re2 = new RegExp(name.replace(/([.*+?^${}()|\[\]\\])/g,'\\$1')+'\s+(?=(👍|👎))','gi')
              out = out.replace(re2, name+' <br>')
            })
            // Remove duplicate lines that repeat the two improvements
            try {
              function norm(s){
                return String(s||'')
                  .toLowerCase()
                  .replace(/^[-*•\s]+/,'')
                  .replace(/[.!\s]+$/,'')
                  .trim()
              }
              const ims = (improvements||[]).map(function(s){ return norm(s) })
              if (ims.length){
                out = out.split('\n').filter(function(line){
                  var t = norm(line)
                  return ims.indexOf(t) === -1
                }).join('\n')
              }
            } catch(_){}
            // Normalize whitespace
            out = out.replace(/\s+/g,' ').trim()
            // Hard breaks before emoji markers regardless of spacing
            out = out
              .replace(/(?!^)⭐/g, '<br>⭐')
              .replace(/(?!^)✨/g, '<br>✨')
              .replace(/(?!^)✅/g, '<br>✅')
              .replace(/(?!^)🔴/g, '<br>🔴')
              .replace(/(?!^)🟢/g, '<br>🟢')
              .replace(/(?!^)👍/g, '<br>👍')
              .replace(/(?!^)👎/g, '<br>👎')
              .replace(/(?!^)👉/g, '<br>👉')
            // Add breaks before key labels if they appear inline
            out = out
              .replace(/(?!^)Product:/g, '<br>Product:')
              .replace(/(?!^)Recommendation:/g, '<br>Recommendation:')
              .replace(/(?!^)Punchline:/g, '<br>Punchline:')
              .replace(/(?!^)Flows to look at for inspiration/g, '<br>Flows to look at for inspiration')
            // Collapse multiple breaks
            out = out.replace(/(<br>\s*){2,}/g, '<br>')
            // Remove markdown bold markers
            out = out.replace(/\*\*(.+?)\*\*/g, '$1')
            return out
          } catch (_) { return String(txt) }
        }
        const formattedJust = formatJustification(data.justification, data.improvements)
        const hasFixesInJust = /Most impactful fixes:/i.test(String(data.justification||'')) || /TOTAL DESIGN POINTS/i.test(String(data.justification||''))
        $('result').innerHTML = `
          <div class="result">
            <h3>Grade: ${data.grade}/1000</h3>
            <div class="muted">Model: ${data.model} • ${data.latency_ms}ms</div>
            <p>${formattedJust}</p>
            ${hasFixesInJust ? '' : `<ul>${((data.improvements||[]).slice(0,2).map(function(it){ return `<li>${it}</li>` }).join(''))}</ul>`}
          </div>
        `
        await loadLeaderboard()
      } catch (e) {
        $('result').innerHTML = `<div class="result" style="border-color:#fecaca;background:#fff1f2;">Error: ${e.message}</div>`
      } finally {
        $('rateBtn').disabled = false
      }
    }

    async function loadLeaderboard(){
      try {
        const res = await fetch(`${getFnUrl()}/leaderboard?limit=50`, { headers: fnHeaders() })
        const data = await res.json()
        const rows = (data||[]).map((r,i)=>
          `<tr>
            <td>${i+1}</td>
            <td>${r.username} · <a href="#" data-username="${r.username}" class="see-designs">See their designs</a></td>
            <td>${r.best_grade}</td>
            <td class="muted">${new Date(r.best_at).toLocaleString()}</td>
          </tr>`
        ).join('')
        $('leaderboardBody').innerHTML = rows
        document.querySelectorAll('.see-designs').forEach(function(a){
          a.addEventListener('click', async function(e){
            e.preventDefault()
            var el = e.currentTarget
            var u = (el && el.getAttribute) ? el.getAttribute('data-username') : null
            if (!u) return
            await openDesignsModal(u)
          })
        })
      } catch (_) {}
    }

    async function openDesignsModal(username){
      const modal = document.createElement('div')
      modal.className = 'modal'
      modal.innerHTML = `
        <div class="modal-content" style="max-width:900px;">
          <div class="modal-header"><h2>Designs by ${username}</h2><button class="close-btn" id="close-modal">×</button></div>
          <div id="gallery" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; max-height:70vh; overflow:auto;"></div>
        </div>`
      document.body.appendChild(modal)
      document.getElementById('close-modal')?.addEventListener('click', ()=> modal.remove())
      try {
        const res = await fetch(`${getFnUrl()}/user_designs?username=${encodeURIComponent(username)}`, { headers: fnHeaders() })
        const items = await res.json()
        const html = (items||[]).map((it)=>`<div><img src="${it.design_storage_path}" style="width:100%; border:1px solid #e5e7eb; border-radius:8px;" /><div class="muted" style="font-size:12px; margin-top:4px;">${new Date(it.created_at).toLocaleString()} · ${it.grade}/100</div></div>`).join('')
        const g = document.getElementById('gallery')
        if (g) g.innerHTML = html || '<div class="muted">No images yet.</div>'
      } catch (e) {
        const g = document.getElementById('gallery')
        if (g) g.innerHTML = '<div class="muted">Failed to load designs.</div>'
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSettings()
      loadLeaderboard()
      $('file').addEventListener('change', e => handleFile(e.target.files[0]))
      document.addEventListener('paste', pasteHandler)
    })
  </script>
  </head>
  <body>
    <div class="container">
      <div class="chat-container">
        <div class="chat-header">
          <h2><i class="fas fa-bolt"></i> Growth Product</h2>
          <div class="header-actions">
            <a class="btn link" href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
            <button id="rateBtn" class="btn primary" onclick="rate()">Rate my design</button>
          </div>
        </div>
        <div class="content">
          <div class="card">
            <div class="row">
              <div>
                <label>Username</label>
                <input id="username" placeholder="your handle" />
              </div>
              <div>
                <label>Email</label>
                <input id="email" placeholder="you@example.com" />
              </div>
            </div>
            <div class="row" style="margin-top:12px;">
              <div>
                <label>Upload image (or paste from clipboard)</label>
                <input id="file" type="file" accept="image/*" />
                <div class="hint">Tip: Take a screenshot, then Cmd+V here.</div>
              </div>
              <div class="preview">
                <img id="imgPreview" style="display:none;" />
              </div>
            </div>
            <div style="margin-top:12px;">
              <label>Context (optional)</label>
              <textarea id="context" placeholder="Platform, screen purpose, target users, etc."></textarea>
            </div>
          </div>
          <div class="card">
            <label>Result</label>
            <div id="result"></div>
          </div>
        </div>
      </div>

      <div class="sidebar">
        
        <div class="card">
          <div class="row">
            <div>
              <label>Model</label>
              <input id="model" placeholder="gpt-4o" />
            </div>
          </div>
          <div style="margin-top:12px;">
            <label>System Prompt</label>
            <textarea id="prompt" placeholder="System prompt used by the growth agent"></textarea>
          </div>
          <div style="margin-top:12px; display:flex; gap:10px;">
            <button class="btn" onclick="saveSettings()">Save Settings</button>
            <span id="saveStatus" class="muted"></span>
          </div>
        </div>
        <div class="card leaderboard">
          <h3 style="margin:0 0 8px;">Leaderboard</h3>
          <table>
            <thead><tr><th>#</th><th>Username</th><th>Best Grade</th><th>When</th></tr></thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </body>
</html>
